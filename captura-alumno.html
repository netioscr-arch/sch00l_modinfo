<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Captura de alumnos">
  <title>Captura de alumno</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .form-wrap { max-width: 720px; margin: 0 auto; padding: clamp(28px, 6vw, 48px) clamp(20px, 5vw, 48px) clamp(48px, 8vw, 80px); }
    .form-titulo { font-size: clamp(1.3rem, 4vw, 1.6rem); font-weight: 700; color: var(--azul-principal); margin-bottom: 6px; }
    .form-sub { color: var(--texto-secundario); margin-bottom: 28px; }
    .form-sub a { color: var(--azul-brillante); font-weight: 600; }
    .campo { margin-bottom: 16px; }
    .campo label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--texto-secundario); margin-bottom: 6px; }
    .campo label .req { color: var(--rojo-acento); }
    .campo input, .campo select { width: 100%; padding: 12px 14px; border: 1px solid rgba(2, 50, 133, 0.2); border-radius: 10px; font: inherit; color: var(--texto); background: #fff; }
    .campo input:focus, .campo select:focus { outline: 3px solid rgba(1, 64, 156, 0.25); border-color: var(--azul-brillante); }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .fila { grid-template-columns: 1fr; } }
    fieldset { border: 1px solid rgba(2, 50, 133, 0.12); border-radius: 12px; padding: 20px; margin: 24px 0; }
    legend { font-weight: 700; color: var(--azul-principal); padding: 0 8px; }
    .mensaje { display: none; border-radius: 12px; padding: 16px 18px; margin-top: 20px; font-size: 0.95rem; }
    .mensaje.exito { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
    .mensaje.error { display: block; background: #fdecea; color: var(--rojo-acento); border: 1px solid #f5c6cb; }
    .mensaje a { color: inherit; font-weight: 600; }
    .enlace-token { word-break: break-all; background: rgba(255, 255, 255, 0.75); padding: 8px 10px; border-radius: 8px; display: block; margin-top: 10px; font-size: 0.9rem; }
    .btn-copiar { margin-top: 10px; padding: 8px 18px; border-radius: 50px; border: 1px solid #1b5e20; background: #fff; color: #1b5e20; font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn-contactar:disabled { opacity: 0.6; cursor: wait; transform: none; }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo-grupo" aria-label="Inicio">
      <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 4L8 14V30C8 44 18 54.5 32 60C46 54.5 56 44 56 30V14L32 4Z" fill="#023285"/>
        <path d="M32 10L14 18V30C14 41 22 49.5 32 54C42 49.5 50 41 50 30V18L32 10Z" fill="#01409C"/>
        <path d="M24 28H40V30H24V28ZM22 34H42V36H22V34ZM26 40H38V42H26V40Z" fill="white" opacity="0.9"/>
        <path d="M32 18L33.5 22.5H38L34.5 25.5L36 30L32 27L28 30L29.5 25.5L26 22.5H30.5L32 18Z" fill="#C60925"/>
      </svg>
      <div class="logo-texto">
        <span class="logo-nombre">Captura de alumno</span>
        <span class="logo-lema">Formando el futuro</span>
      </div>
    </a>
  </header>

  <main class="form-wrap">
    <h1 class="form-titulo">Captura de alumno</h1>
    <p class="form-sub">El alumno queda ligado a una escuela ya capturada.
      ¿Falta la escuela? <a href="captura-escuela.html">Capturar escuela</a></p>

    <form id="form-alumno" novalidate>
      <div class="campo">
        <label for="escuela">Escuela <span class="req">*</span></label>
        <select id="escuela" name="escuela" required>
          <option value="">Cargando escuelas…</option>
        </select>
      </div>

      <div class="campo">
        <label for="ciclo">Ciclo escolar <span class="req">*</span></label>
        <select id="ciclo" name="ciclo" required>
          <option value="">Cargando ciclos…</option>
        </select>
      </div>

      <div class="campo">
        <label for="nombres">Nombre(s) <span class="req">*</span></label>
        <input id="nombres" name="nombres" type="text" required autocomplete="off" placeholder="Ej. María Fernanda">
      </div>

      <div class="fila">
        <div class="campo">
          <label for="apellido_paterno">Apellido paterno <span class="req">*</span></label>
          <input id="apellido_paterno" name="apellido_paterno" type="text" required autocomplete="off">
        </div>
        <div class="campo">
          <label for="apellido_materno">Apellido materno</label>
          <input id="apellido_materno" name="apellido_materno" type="text" autocomplete="off">
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label for="numero_alumno">Número de alumno</label>
          <input id="numero_alumno" name="numero_alumno" type="text" autocomplete="off" placeholder="Ej. 12345">
        </div>
        <div class="campo">
          <label for="grupo">Grupo <span class="req">*</span></label>
          <input id="grupo" name="grupo" type="text" required autocomplete="off" placeholder="Ej. A">
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label for="grado">Grado</label>
          <input id="grado" name="grado" type="text" inputmode="numeric" autocomplete="off" placeholder="Ej. 3">
        </div>
        <div class="campo">
          <label for="turno">Turno</label>
          <select id="turno" name="turno">
            <option value="">Sin especificar</option>
            <option value="Matutino">Matutino</option>
            <option value="Vespertino">Vespertino</option>
          </select>
        </div>
      </div>

      <fieldset>
        <legend>Tutor</legend>
        <div class="campo">
          <label for="tutor_nombres">Nombre del tutor</label>
          <input id="tutor_nombres" name="tutor_nombres" type="text" autocomplete="off" placeholder="Ej. Juan Pérez">
        </div>
        <div class="fila">
          <div class="campo">
            <label for="tutor_correo">Correo del tutor</label>
            <input id="tutor_correo" name="tutor_correo" type="email" autocomplete="off" placeholder="Ej. tutor@ejemplo.com">
          </div>
          <div class="campo">
            <label for="tutor_telefono">Teléfono del tutor</label>
            <input id="tutor_telefono" name="tutor_telefono" type="tel" autocomplete="off" placeholder="Ej. 834 123 4567">
          </div>
        </div>
      </fieldset>

      <button class="btn-contactar" type="submit" id="btn-guardar">Guardar alumno</button>
    </form>

    <div class="mensaje" id="mensaje" role="status"></div>
  </main>

  <footer class="footer">
    <strong>Captura de alumnos</strong><span> · Formando el futuro con excelencia académica y valores</span>
  </footer>

  <script>
  (function () {
    'use strict';

    var SUPABASE_URL = 'https://aghllznrmjmhjxzbzito.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_t59QVHo-9-nECQnUYu0tOg_2z_x108-';
    var PRESENTACION_URL = 'https://sch00l-modinfo.vercel.app/';

    var form = document.getElementById('form-alumno');
    var mensaje = document.getElementById('mensaje');
    var boton = document.getElementById('btn-guardar');
    var selectEscuela = document.getElementById('escuela');
    var selectCiclo = document.getElementById('ciclo');
    var cicloActualId = null;

    function mostrar(tipo, html) {
      mensaje.className = 'mensaje ' + tipo;
      mensaje.innerHTML = html;
      mensaje.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function valor(id) {
      var v = document.getElementById(id).value;
      return v ? v.trim() : '';
    }

    function rpc(nombre, body) {
      return fetch(SUPABASE_URL + '/rest/v1/rpc/' + nombre, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        },
        body: JSON.stringify(body || {})
      }).then(function (resp) {
        return resp.json().then(function (data) {
          if (!resp.ok) throw new Error((data && data.message) || 'No se pudo conectar.');
          return data;
        });
      });
    }

    /* Cargar ciclos escolares en el desplegable (por defecto, el actual) */
    rpc('listar_ciclos').then(function (ciclos) {
      selectCiclo.innerHTML = '';
      if (!ciclos || ciclos.length === 0) {
        selectCiclo.innerHTML = '<option value="">No hay ciclos escolares</option>';
        mostrar('error', 'No hay ciclos escolares capturados. Captura uno en Supabase (tabla ciclo_escolar) y marca el actual.');
        return;
      }
      ciclos.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.nombre + (c.actual ? ' (actual)' : '');
        if (c.actual) { opt.selected = true; cicloActualId = String(c.id); }
        selectCiclo.appendChild(opt);
      });
      if (cicloActualId === null) {
        cicloActualId = String(ciclos[0].id);
        selectCiclo.value = cicloActualId;
      }
    }).catch(function () {
      selectCiclo.innerHTML = '<option value="">No se pudieron cargar los ciclos</option>';
      mostrar('error', 'No se pudieron cargar los ciclos escolares. Revisa que el archivo SUPABASE_formularios_captura.sql ya se haya ejecutado en Supabase.');
    });

    /* Cargar escuelas capturadas en el desplegable */
    rpc('listar_escuelas').then(function (escuelas) {
      selectEscuela.innerHTML = '<option value="">Elige una escuela…</option>';
      if (!escuelas || escuelas.length === 0) {
        selectEscuela.innerHTML = '<option value="">No hay escuelas capturadas</option>';
        mostrar('error', 'Todavía no hay escuelas capturadas. Primero <a href="captura-escuela.html">captura una escuela</a>.');
        return;
      }
      escuelas.forEach(function (e) {
        var opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.nombre + (e.cct ? ' (' + e.cct + ')' : '');
        selectEscuela.appendChild(opt);
      });
    }).catch(function () {
      selectEscuela.innerHTML = '<option value="">No se pudieron cargar las escuelas</option>';
      mostrar('error', 'No se pudieron cargar las escuelas. Revisa que el archivo SUPABASE_formularios_captura.sql ya se haya ejecutado en Supabase.');
    });

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();

      var escuelaId = selectEscuela.value;
      var cicloId = selectCiclo.value;
      var nombres = valor('nombres');
      var apellidoPaterno = valor('apellido_paterno');
      var grupo = valor('grupo');
      if (!escuelaId || !cicloId || !nombres || !apellidoPaterno || !grupo) {
        mostrar('error', 'Faltan datos: escuela, ciclo escolar, nombre, apellido paterno y grupo son obligatorios.');
        return;
      }

      boton.disabled = true;
      boton.textContent = 'Guardando…';
      mensaje.className = 'mensaje';
      mensaje.innerHTML = '';

      rpc('registrar_alumno', {
        p_escuela_id: escuelaId,
        p_nombres: nombres,
        p_apellido_paterno: apellidoPaterno,
        p_apellido_materno: valor('apellido_materno') || null,
        p_numero_alumno: valor('numero_alumno') || null,
        p_grupo: grupo,
        p_grado: valor('grado') || null,
        p_turno: valor('turno') || null,
        p_tutor_nombres: valor('tutor_nombres') || null,
        p_tutor_correo: valor('tutor_correo') || null,
        p_tutor_telefono: valor('tutor_telefono') || null,
        p_ciclo_id: parseInt(cicloId, 10)
      })
      .then(function (data) {
        var row = Array.isArray(data) ? data[0] : data;
        var token = row && row.token_publico;
        if (!token) throw new Error('Se guardó, pero no se recibió el enlace. Búscalo por su número de alumno.');
        var enlace = PRESENTACION_URL + '?t=' + token;
        var nombreCompleto = nombres + ' ' + apellidoPaterno + (valor('apellido_materno') ? ' ' + valor('apellido_materno') : '');
        mostrar('exito', '<strong>Alumno guardado:</strong> ' + nombreCompleto + '.<br>' +
          'Su enlace de presentación es:<span class="enlace-token">' + enlace + '</span>' +
          '<button type="button" class="btn-copiar" id="btn-copiar">Copiar enlace</button> ' +
          '<a href="' + enlace + '" target="_blank" rel="noopener">Ver presentación</a>');
        document.getElementById('btn-copiar').addEventListener('click', function () {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(enlace).then(function () {
              document.getElementById('btn-copiar').textContent = 'Copiado';
            });
          }
        });
        form.reset();
        if (cicloActualId !== null) selectCiclo.value = cicloActualId;
      })
      .catch(function (err) {
        mostrar('error', '<strong>No se pudo guardar.</strong> ' + (err.message || 'Intenta de nuevo más tarde.'));
      })
      .finally(function () {
        boton.disabled = false;
        boton.textContent = 'Guardar alumno';
      });
    });
  })();
  </script>
</body>
</html>
